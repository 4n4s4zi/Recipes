#Docker compose for setting up a falco-monitored DVWA instance
services:

  db:
    image: mariadb:10
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa-target
    ports:
      - "8080:80"
    environment:
      - DB_SERVER=db
    depends_on:
      - db
    restart: unless-stopped

  falco:
    image: falcosecurity/falco:latest
    container_name: falco-monitor
    privileged: true
    depends_on:
      - dvwa
      - falcosidekick
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
    environment:
      - SYSDIG_HOST_ROOT=/
    command:
      - falco
      - -o
      - json_output=true
      - -o
      - http_output.enabled=true
      - -o
      - http_output.url=http://falcosidekick:2801/
    restart: unless-stopped

  falcosidekick:
    image: falcosecurity/falcosidekick:latest
    container_name: falcosidekick
    ports:
      - "2801:2801"
    environment:
      - WEBUI_URL=http://falcosidekick-ui:2802
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped

  falcosidekick-ui:
    image: falcosecurity/falcosidekick-ui:latest
    container_name: falcosidekick-ui
    ports:
      - "2802:2802"
    environment:
      - FALCOSIDEKICK_UI_REDIS_URL=redis:6379
    depends_on:
      - falcosidekick
      - redis
    restart: unless-stopped

volumes:
  db-data:

